// N&B public example configuration.
// Copy this file to server1.cfg on the server, then replace all placeholders.

// [General]
rcon_password "CHANGE_ME"
sv_steamgroup "YOUR_STEAM_GROUP_ID"
sv_search_key "CHANGE_ME"
sv_tags "versus,zonemod,Night"

motdfile "mymotd.txt"
hostfile "myhost.txt"

// What .cfg files to load on Matchmode load (plugins only).
sm_cvar confogl_match_execcfg_plugins "generalfixes.cfg;confogl_plugins.cfg;sharedplugins.cfg"

// [File consistency]
sv_consistency "0"
sv_pure "2"
sv_pure_kick_clients "1"

// [Logging]
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 0
sv_logbans 1
sv_logflush 0
sv_logsdir logs

// [Addon disabler]
sm_cvar l4d2_addons_eclipse 0

// Tickrate fixes
sm_cvar tick_door_speed 1.3

// Slots
sm_cvar mv_maxplayers 12

// Disable wait commands
sm_cvar sv_allow_wait_command 0

// [Networking, 100 tick rates]
sm_cvar sv_maxunlag 0.35
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio 0
sm_cvar sv_client_max_interp_ratio 0
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar net_splitpacket_maxrate 100000
sm_cvar net_maxcleartime 0.0001
sm_cvar sv_clockcorrection_msecs 20

// [Performance]
sm_cvar sv_unlag_fixstuck 1
sm_cvar sv_forcepreload 1
sm_cvar fps_max 0
sm_cvar nb_update_frequency 0.01
sm_cvar nb_update_maxslide 1
sm_cvar nb_update_framelimit 5

// [Queries]
sm_cvar sv_max_queries_sec_global 20
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10

// [Match mode]
sm_forcematch zonemod
sm_cvar sv_region "4"

// Keep versus running and allow survivor Bots to progress when no human is on survivors.
sm_cvar sb_all_bot_game 1
sm_cvar allow_all_bot_survivor_team 1
